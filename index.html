<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📐 樞紐定理與大小關係互動探索</title>
    <style>
        :root {
            --bg-color: #fdf6e3;
            --primary-color: #8b5a2b; /* Capybara brown */
            --secondary-color: #6b8e23; /* Grass green */
            --accent-color: #ff7f50;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-radius: 16px;
        }

        body {
            font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .tab-btn {
            background-color: #e0d8c3;
            color: var(--primary-color);
            border: 3px solid var(--primary-color);
            padding: 12px 24px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .tab-btn.active {
            background-color: var(--secondary-color);
            color: white;
            border-color: var(--secondary-color);
            transform: scale(1.05);
        }

        .tab-btn:hover {
            transform: scale(1.05);
        }

        .mode-container {
            display: none;
            width: 100%;
            max-width: 1200px;
            flex-direction: column;
            align-items: center;
        }

        .mode-container.active {
            display: flex;
        }

        .controls {
            background: var(--card-bg);
            padding: 15px 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
            font-size: 1.2rem;
            border: 2px dashed var(--primary-color);
        }

        .controls input {
            width: 60px;
            font-size: 1.2rem;
            padding: 5px;
            border-radius: 8px;
            border: 2px solid var(--secondary-color);
            text-align: center;
        }

        .cards-wrapper {
            display: flex;
            gap: 20px;
            width: 100%;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .card {
            background: var(--card-bg);
            flex: 1;
            min-width: 300px;
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 3px solid #e0d8c3;
        }

        .card h3 {
            color: var(--secondary-color);
            margin-top: 0;
            font-size: 1.5rem;
            text-align: center;
        }

        canvas {
            background: #fafafa;
            border: 2px solid #ddd;
            border-radius: 12px;
            margin: 15px 0;
            max-width: 100%;
        }

        .slider-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
        }

        input[type=range] {
            width: 80%;
            margin-top: 10px;
        }

        .data-panel {
            background: #eef8e6;
            padding: 10px;
            border-radius: 8px;
            width: 90%;
            text-align: center;
            font-size: 1.1rem;
            border: 1px solid var(--secondary-color);
        }

        .tip {
            color: var(--accent-color);
            font-weight: bold;
            margin-top: 10px;
            font-size: 1.1rem;
        }

        .game-board {
            background: var(--card-bg);
            width: 100%;
            max-width: 800px;
            border-radius: var(--border-radius);
            padding: 30px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            text-align: center;
            border: 4px solid var(--primary-color);
            position: relative;
        }

        .capybara-prompt {
            background: #f5deb3;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 20px;
            display: inline-block;
            border: 2px solid var(--primary-color);
        }

        .answer-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .answer-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .answer-btn:hover {
            transform: translateY(-3px);
            background-color: #ff6347;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            border-radius: var(--border-radius);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .overlay.active {
            display: flex;
        }

        .overlay-content {
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .overlay-success { background: #d4edda; border: 3px solid #c3e6cb; color: #155724; }
        .overlay-error { background: #f8d7da; border: 3px solid #f5c6cb; color: #721c24; }
        
        .overlay h2 { font-size: 2rem; margin-top: 0; }
        .overlay p { font-size: 1.3rem; margin-bottom: 20px; }
        
        .overlay button {
            padding: 10px 25px; font-size: 1.2rem;
            background: var(--primary-color); color: white;
            border: none; border-radius: 8px; cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>📐 樞紐定理與大小關係互動探索</h1>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('explore')">自由探索模式 🔍</button>
        <button class="tab-btn" onclick="switchTab('game')">水豚老師大小挑戰 🎮</button>
    </div>

    <div id="explore-mode" class="mode-container active">
        <div class="controls">
            <label>藍色固定邊長 a: <input type="number" id="input-a" value="4" min="1" max="10"></label>
            <label>綠色固定邊長 b: <input type="number" id="input-b" value="5" min="1" max="10"></label>
        </div>

        <div class="cards-wrapper">
            <!-- Acute Card -->
            <div class="card">
                <h3>銳角探索 (θ < 90°)</h3>
                <div class="slider-container">
                    <label>夾角 θ: <span id="val-acute">45</span>°</label>
                    <input type="range" id="slider-acute" min="10" max="89" value="45">
                </div>
                <canvas id="canvas-acute" width="300" height="250"></canvas>
            </div>

            <!-- Showdown Card -->
            <div class="card" style="flex: 1.5;">
                <h3>三邊三角大對決</h3>
                <div class="slider-container">
                    <label>自由調整夾角 θ: <span id="val-showdown">90</span>°</label>
                    <input type="range" id="slider-showdown" min="10" max="170" value="90">
                </div>
                <canvas id="canvas-showdown" width="400" height="300"></canvas>
                <div class="data-panel" id="data-showdown">
                    數值載入中...
                </div>
                <div class="tip">💡 最大的角所對應的邊，也是最長的一條邊喔！</div>
            </div>

            <!-- Obtuse Card -->
            <div class="card">
                <h3>鈍角探索 (θ > 90°)</h3>
                <div class="slider-container">
                    <label>夾角 θ: <span id="val-obtuse">135</span>°</label>
                    <input type="range" id="slider-obtuse" min="91" max="170" value="135">
                </div>
                <canvas id="canvas-obtuse" width="300" height="250"></canvas>
            </div>
        </div>
    </div>

    <div id="game-mode" class="mode-container">
        <div class="game-board">
            <div class="capybara-prompt" id="game-prompt">載入中...</div>
            <canvas id="canvas-game" width="700" height="350"></canvas>
            
            <div class="answer-buttons" id="game-buttons">
                <!-- Buttons injected via JS -->
            </div>

            <!-- Overlay Feedback -->
            <div class="overlay" id="game-overlay">
                <div class="overlay-content" id="overlay-box">
                    <h2 id="overlay-title"></h2>
                    <p id="overlay-msg"></p>
                    <button id="overlay-btn"></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let state = {
            a: 4, b: 5,
            acute: 45, showdown: 90, obtuse: 135,
            gameStage: 1,
            gameCorrectAnswer: null
        };

        const canvasAcute = document.getElementById('canvas-acute');
        const canvasShowdown = document.getElementById('canvas-showdown');
        const canvasObtuse = document.getElementById('canvas-obtuse');
        const canvasGame = document.getElementById('canvas-game');

        function switchTab(mode) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('explore-mode').classList.remove('active');
            document.getElementById('game-mode').classList.remove('active');
            
            document.getElementById(`${mode}-mode`).classList.add('active');
            
            if (mode === 'game') initGame();
            else updateExplore();
        }

        function degToRad(deg) { return deg * Math.PI / 180; }
        function radToDeg(rad) { return rad * 180 / Math.PI; }

        function drawTriangle(ctx, width, height, sideA, sideB, angleDeg, options = {}) {
            const {
                showSides = false,
                showAllAngles = false,
                thirdSideColor = '#ff7f50',
                labelThirdSide = '',
                offsetX = 0,
                offsetY = 0,
                scaleMultiplier = 1
            } = options;

            const angleRad = degToRad(angleDeg);
            
            // Calculate coordinates (Origin at C)
            // Let's place vertex C at origin (0,0)
            // Vertex A (along x-axis): (sideB, 0)
            // Vertex B: (sideA * cos(angle), sideA * sin(angle))
            
            let pC = {x: 0, y: 0};
            let pA = {x: sideB, y: 0};
            let pB = {x: sideA * Math.cos(angleRad), y: sideA * Math.sin(angleRad)};

            // Calculate bounding box to center and scale
            const minX = Math.min(pC.x, pA.x, pB.x);
            const maxX = Math.max(pC.x, pA.x, pB.x);
            const minY = Math.min(pC.y, pA.y, pB.y);
            const maxY = Math.max(pC.y, pA.y, pB.y);

            const triW = maxX - minX;
            const triH = maxY - minY;

            // Determine scale to fit canvas
            const padding = 50;
            const scale = Math.min((width - padding) / triW, (height - padding) / triH) * scaleMultiplier;

            // Transform function
            const cx = width / 2 + offsetX;
            const cy = height / 2 + offsetY + (triH * scale / 4); // slight adjust
            
            const tx = (x) => cx + (x - (minX + maxX)/2) * scale;
            const ty = (y) => cy - (y - (minY + maxY)/2) * scale; // invert y for visual

            const tC = {x: tx(pC.x), y: ty(pC.y)};
            const tA = {x: tx(pA.x), y: ty(pA.y)};
            const tB = {x: tx(pB.x), y: ty(pB.y)};

            // Draw side a (CB)
            ctx.beginPath(); ctx.moveTo(tC.x, tC.y); ctx.lineTo(tB.x, tB.y);
            ctx.strokeStyle = '#4169e1'; ctx.lineWidth = 4; ctx.stroke();
            
            // Draw side b (CA)
            ctx.beginPath(); ctx.moveTo(tC.x, tC.y); ctx.lineTo(tA.x, tA.y);
            ctx.strokeStyle = '#32cd32'; ctx.lineWidth = 4; ctx.stroke();

            // Draw third side c (AB)
            ctx.beginPath(); ctx.moveTo(tA.x, tA.y); ctx.lineTo(tB.x, tB.y);
            ctx.strokeStyle = thirdSideColor; ctx.lineWidth = 4; ctx.setLineDash(labelThirdSide === '?' ? [5, 5] : []); ctx.stroke();
            ctx.setLineDash([]);

            // Draw angle arc at C
            ctx.beginPath();
            ctx.arc(tC.x, tC.y, 25, -angleRad, 0); 
            ctx.strokeStyle = '#ffa500'; ctx.lineWidth = 2; ctx.stroke();

            ctx.font = '16px "Comic Sans MS", Arial';
            ctx.fillStyle = '#333';
            ctx.fillText(`${angleDeg}°`, tC.x - 10, tC.y + 20);

            // Calculate side c length
            const sideC = Math.sqrt(sideA*sideA + sideB*sideB - 2*sideA*sideB*Math.cos(angleRad));

            if (showSides) {
                ctx.fillStyle = '#4169e1';
                ctx.fillText(sideA.toFixed(1), (tC.x + tB.x)/2 - 20, (tC.y + tB.y)/2 - 10);
                ctx.fillStyle = '#32cd32';
                ctx.fillText(sideB.toFixed(1), (tC.x + tA.x)/2, (tC.y + tA.y)/2 + 20);
                ctx.fillStyle = thirdSideColor;
                ctx.fillText(sideC.toFixed(1), (tA.x + tB.x)/2 + 10, (tA.y + tB.y)/2 - 10);
            } else if (labelThirdSide === '?') {
                ctx.fillStyle = thirdSideColor;
                ctx.font = 'bold 20px Arial';
                ctx.fillText('c = ?', (tA.x + tB.x)/2 + 10, (tA.y + tB.y)/2 - 10);
            }

            if (showAllAngles) {
                // Law of sines/cosines to get other angles
                const angleA = radToDeg(Math.acos((sideB*sideB + sideC*sideC - sideA*sideA)/(2*sideB*sideC)));
                const angleB = 180 - angleDeg - angleA;
                
                ctx.fillStyle = '#333';
                ctx.fillText(`${angleA.toFixed(1)}°`, tA.x + 10, tA.y - 10);
                ctx.fillText(`${angleB.toFixed(1)}°`, tB.x - 20, tB.y - 20);
            }

            return { sideC };
        }

        function updateExplore() {
            state.a = parseFloat(document.getElementById('input-a').value) || 4;
            state.b = parseFloat(document.getElementById('input-b').value) || 5;
            
            // Acute
            const ctxAcute = canvasAcute.getContext('2d');
            ctxAcute.clearRect(0,0, canvasAcute.width, canvasAcute.height);
            drawTriangle(ctxAcute, canvasAcute.width, canvasAcute.height, state.a, state.b, state.acute);

            // Obtuse
            const ctxObtuse = canvasObtuse.getContext('2d');
            ctxObtuse.clearRect(0,0, canvasObtuse.width, canvasObtuse.height);
            drawTriangle(ctxObtuse, canvasObtuse.width, canvasObtuse.height, state.a, state.b, state.obtuse);

            // Showdown
            const ctxShow = canvasShowdown.getContext('2d');
            ctxShow.clearRect(0,0, canvasShowdown.width, canvasShowdown.height);
            const { sideC } = drawTriangle(ctxShow, canvasShowdown.width, canvasShowdown.height, state.a, state.b, state.showdown, { showSides: true, showAllAngles: true });
            
            // Update Data panel
            const panel = document.getElementById('data-showdown');
            panel.innerHTML = `
                邊長: 藍=${state.a.toFixed(1)}, 綠=${state.b.toFixed(1)}, <span style="color:#ff7f50">紅=${sideC.toFixed(1)}</span><br>
                夾角: ${state.showdown}°
            `;
        }

        ['acute', 'showdown', 'obtuse'].forEach(type => {
            document.getElementById(`slider-${type}`).addEventListener('input', (e) => {
                state[type] = parseInt(e.target.value);
                document.getElementById(`val-${type}`).innerText = state[type];
                updateExplore();
            });
        });

        document.getElementById('input-a').addEventListener('change', updateExplore);
        document.getElementById('input-b').addEventListener('change', updateExplore);

        function initGame() {
            const ctx = canvasGame.getContext('2d');
            ctx.clearRect(0,0, canvasGame.width, canvasGame.height);
            const promptEl = document.getElementById('game-prompt');
            const btnsEl = document.getElementById('game-buttons');
            hideOverlay();

            if (state.gameStage === 1) {
                // Stage 1: Hinge Theorem
                const baseA = 4 + Math.floor(Math.random()*3);
                const baseB = baseA + 1 + Math.floor(Math.random()*2);
                
                let ang1 = 30 + Math.floor(Math.random()*40);
                let ang2 = 80 + Math.floor(Math.random()*60);
                
                // Randomize A and B positions
                const isLeftLarger = Math.random() > 0.5;
                const angLeft = isLeftLarger ? ang2 : ang1;
                const angRight = isLeftLarger ? ang1 : ang2;
                
                state.gameCorrectAnswer = isLeftLarger ? 'A' : 'B';

                promptEl.innerHTML = "🦫 水豚老師問：這裡有兩個三角形。哪一個三角形的紅色第三邊比較長呢？";
                
                // Draw Left (A)
                drawTriangle(ctx, canvasGame.width/2, canvasGame.height, baseA, baseB, angLeft, {
                    labelThirdSide: '?', offsetX: -canvasGame.width/4, scaleMultiplier: 0.8
                });
                ctx.fillStyle = '#333'; ctx.font = 'bold 24px Arial'; ctx.fillText('A', canvasGame.width/4 - 10, 30);

                // Draw Right (B)
                drawTriangle(ctx, canvasGame.width/2, canvasGame.height, baseA, baseB, angRight, {
                    labelThirdSide: '?', offsetX: canvasGame.width/4, scaleMultiplier: 0.8
                });
                ctx.fillText('B', canvasGame.width*0.75 - 10, 30);

                btnsEl.innerHTML = `
                    <button class="answer-btn" onclick="checkAnswer('A')">三角形 A</button>
                    <button class="answer-btn" onclick="checkAnswer('B')">三角形 B</button>
                `;
            } else {
                // Stage 2: Longest side -> Largest angle
                // Generate random sides satisfying triangle inequality
                const sides = [5, 6, 8].map(x => x + Math.floor(Math.random()*3)); 
                sides.sort((a,b) => a-b);
                if (sides[0] + sides[1] <= sides[2]) sides[2] = sides[0] + sides[1] - 1;

                // Shuffle assignment
                const labels = ['A', 'B', 'C'];
                for (let i = labels.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [sides[i], sides[j]] = [sides[j], sides[i]];
                }
                
                const [sideA, sideB, sideC] = sides;
                const maxSide = Math.max(sideA, sideB, sideC);
                if (maxSide === sideA) state.gameCorrectAnswer = 'A';
                else if (maxSide === sideB) state.gameCorrectAnswer = 'B';
                else state.gameCorrectAnswer = 'C';

                promptEl.innerHTML = "🦫 水豚老師問：已知這三條邊的長度，請找出哪一個角最大？";

                // Draw custom SSS triangle
                drawSSSTriangle(ctx, canvasGame.width, canvasGame.height, sideA, sideB, sideC);

                btnsEl.innerHTML = `
                    <button class="answer-btn" onclick="checkAnswer('A')">角 A</button>
                    <button class="answer-btn" onclick="checkAnswer('B')">角 B</button>
                    <button class="answer-btn" onclick="checkAnswer('C')">角 C</button>
                `;
            }
        }

        function drawSSSTriangle(ctx, width, height, a, b, c) {
            // Calculate angle C using Law of Cosines
            const cosC = (a*a + b*b - c*c) / (2 * a * b);
            const angleC = Math.acos(cosC);
            
            // Vertices
            const pC = {x: 0, y: 0};
            const pA = {x: b, y: 0};
            const pB = {x: a * Math.cos(angleC), y: a * Math.sin(angleC)};

            const minX = Math.min(pC.x, pA.x, pB.x); const maxX = Math.max(pC.x, pA.x, pB.x);
            const minY = Math.min(pC.y, pA.y, pB.y); const maxY = Math.max(pC.y, pA.y, pB.y);
            const scale = Math.min((width - 100) / (maxX - minX), (height - 100) / (maxY - minY));
            
            const cx = width / 2; const cy = height / 2 + (maxY-minY)*scale/4;
            const tx = (x) => cx + (x - (minX + maxX)/2) * scale;
            const ty = (y) => cy - (y - (minY + maxY)/2) * scale;

            const tC = {x: tx(pC.x), y: ty(pC.y)};
            const tA = {x: tx(pA.x), y: ty(pA.y)};
            const tB = {x: tx(pB.x), y: ty(pB.y)};

            ctx.beginPath(); ctx.moveTo(tC.x, tC.y); ctx.lineTo(tA.x, tA.y); ctx.lineTo(tB.x, tB.y); ctx.closePath();
            ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 4; ctx.stroke();
            ctx.fillStyle = '#fdf6e3'; ctx.fill();

            ctx.font = 'bold 20px Arial'; ctx.fillStyle = '#333';
            ctx.fillText('C', tC.x - 20, tC.y + 20);
            ctx.fillText('A', tA.x + 10, tA.y + 20);
            ctx.fillText('B', tB.x - 10, tB.y - 15);

            // Labels for sides
            ctx.fillStyle = '#e63946';
            ctx.fillText(`a = ${a}`, (tC.x + tB.x)/2 - 40, (tC.y + tB.y)/2);
            ctx.fillStyle = '#2a9d8f';
            ctx.fillText(`b = ${b}`, (tC.x + tA.x)/2, (tC.y + tA.y)/2 + 25);
            ctx.fillStyle = '#e76f51';
            ctx.fillText(`c = ${c}`, (tA.x + tB.x)/2 + 10, (tA.y + tB.y)/2);
        }

        function checkAnswer(ans) {
            const isCorrect = (ans === state.gameCorrectAnswer);
            const overlay = document.getElementById('game-overlay');
            const box = document.getElementById('overlay-box');
            const title = document.getElementById('overlay-title');
            const msg = document.getElementById('overlay-msg');
            const btn = document.getElementById('overlay-btn');

            overlay.classList.add('active');
            
            if (isCorrect) {
                box.className = 'overlay-content overlay-success';
                title.innerText = '🎉 太棒了！答對啦！';
                
                if (state.gameStage === 1) {
                    msg.innerText = '角度越大的地方，它所對應的邊就會越長喔！';
                    btn.innerText = '挑戰第二關 👉';
                    btn.onclick = () => { state.gameStage = 2; initGame(); };
                } else {
                    msg.innerText = '大邊對大角，最長的邊對應的一定是最大的角！';
                    btn.innerText = '再玩一次 🔄';
                    btn.onclick = () => { state.gameStage = 1; initGame(); };
                }
            } else {
                box.className = 'overlay-content overlay-error';
                title.innerText = '🤔 哎呀，再想想看！';
                msg.innerText = state.gameStage === 1 
                    ? '提示：注意看看哪個夾角比較大，樞紐定理告訴我們...' 
                    : '提示：找出最長的那一條邊，它對面的那個角就是最大的喔！';
                btn.innerText = '再試一次 ↩️';
                btn.onclick = hideOverlay;
            }
        }

        function hideOverlay() {
            document.getElementById('game-overlay').classList.remove('active');
