<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📐 樞紐定理互動探索</title>
    <style>
        :root {
            --primary: #4A90E2;
            --secondary: #F39C12;
            --success: #2ECC71;
            --danger: #E74C3C;
            --bg-color: #F8F9FA;
            --text-color: #333333;
            --card-bg: #FFFFFF;
        }

        body {
            font-family: 'Nunito', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 2.5rem;
            text-align: center;
            color: var(--primary);
            margin-bottom: 20px;
        }

        /* 頁籤切換按鈕區 */
        .tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            font-size: 1.5rem;
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            background-color: #E0E0E0;
            color: #555;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .tab-btn:hover {
            transform: translateY(-2px);
            background-color: #D5D5D5;
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 6px 12px rgba(74, 144, 226, 0.4);
        }

        /* 內容區塊 */
        .section {
            display: none;
            width: 100%;
            max-width: 1200px;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.5s ease-in-out;
        }

        .section.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 自由探索模式 UI */
        .control-panel {
            background-color: var(--card-bg);
            padding: 20px 40px;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            display: flex;
            gap: 30px;
            align-items: center;
            font-size: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .control-panel input {
            font-size: 1.5rem;
            width: 80px;
            padding: 5px 10px;
            border: 2px solid #CCC;
            border-radius: 10px;
            text-align: center;
        }

        .legend {
            font-size: 1.2rem;
            color: #666;
            margin-top: 10px;
            text-align: center;
            width: 100%;
        }

        .cards-container {
            display: flex;
            gap: 20px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            min-width: 300px;
            max-width: 380px;
        }

        canvas {
            background-color: #FAFAFA;
            border: 2px dashed #E0E0E0;
            border-radius: 15px;
            margin: 15px 0;
            max-width: 100%;
        }

        .slider-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        input[type="range"] {
            width: 90%;
            cursor: pointer;
        }

        .angle-label {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--text-color);
        }

        /* 挑戰模式 UI */
        .challenge-prompt {
            font-size: 2rem;
            font-weight: bold;
            color: #8E44AD;
            text-align: center;
            margin-bottom: 30px;
            background-color: #F5EEF8;
            padding: 20px 40px;
            border-radius: 20px;
            border: 3px solid #D2B4DE;
        }

        .challenge-cards {
            display: flex;
            gap: 40px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .challenge-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 4px solid transparent;
            transition: border-color 0.3s;
        }
        
        .challenge-card.selected {
            border-color: var(--primary);
        }

        .challenge-title {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--primary);
        }

        .answer-buttons {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .ans-btn {
            font-size: 1.5rem;
            padding: 15px 30px;
            border: none;
            border-radius: 15px;
            background-color: var(--primary);
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }

        .ans-btn:hover {
            transform: scale(1.05);
            background-color: #357ABD;
        }

        .ans-btn:active {
            transform: scale(0.95);
        }

        .feedback {
            font-size: 1.8rem;
            font-weight: bold;
            text-align: center;
            min-height: 2.5rem;
            margin: 20px 0;
            padding: 15px 30px;
            border-radius: 15px;
            display: none;
        }

        .feedback.success {
            display: block;
            background-color: #D5F5E3;
            color: #1E8449;
            border: 2px solid #2ECC71;
        }

        .feedback.error {
            display: block;
            background-color: #FADBD8;
            color: #C0392B;
            border: 2px solid #E74C3C;
        }

        .next-btn {
            font-size: 1.5rem;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            background-color: var(--secondary);
            color: white;
            cursor: pointer;
            font-weight: bold;
            display: none;
            box-shadow: 0 4px 8px rgba(243, 156, 18, 0.4);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .next-btn:hover {
            background-color: #D68910;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

    </style>
</head>
<body>

    <h1>📐 樞紐定理互動探索</h1>

    <!-- 頁籤切換區 -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('explore')">🔍 自由探索模式</button>
        <button class="tab-btn" onclick="switchTab('challenge')">🎮 水豚老師大小挑戰</button>
    </div>

    <!-- 自由探索模式 -->
    <div id="explore-section" class="section active">
        <div class="control-panel">
            <div>
                <label for="side-a">固定邊長 $a$：</label>
                <input type="number" id="side-a" value="4" min="1" max="15" onchange="updateExploreAll()">
            </div>
            <div>
                <label for="side-b">固定邊長 $b$：</label>
                <input type="number" id="side-b" value="5" min="1" max="15" onchange="updateExploreAll()">
            </div>
            <div class="legend">🟦 固定邊長 (a, b)&nbsp;&nbsp;&nbsp;&nbsp;🟥 變動的第三邊</div>
        </div>

        <div class="cards-container">
            <!-- 卡片 1 -->
            <div class="card">
                <div class="slider-container">
                    <input type="range" id="slider-1" min="10" max="170" value="30" oninput="updateExplore(1)">
                </div>
                <canvas id="canvas-1" width="300" height="250"></canvas>
                <div class="angle-label" id="label-1">夾角：30度</div>
            </div>
            <!-- 卡片 2 -->
            <div class="card">
                <div class="slider-container">
                    <input type="range" id="slider-2" min="10" max="170" value="90" oninput="updateExplore(2)">
                </div>
                <canvas id="canvas-2" width="300" height="250"></canvas>
                <div class="angle-label" id="label-2">夾角：90度</div>
            </div>
            <!-- 卡片 3 -->
            <div class="card">
                <div class="slider-container">
                    <input type="range" id="slider-3" min="10" max="170" value="150" oninput="updateExplore(3)">
                </div>
                <canvas id="canvas-3" width="300" height="250"></canvas>
                <div class="angle-label" id="label-3">夾角：150度</div>
            </div>
        </div>
    </div>

    <!-- 水豚老師挑戰模式 -->
    <div id="challenge-section" class="section">
        <div class="challenge-prompt">
            🦫 水豚老師問：請觀察下面的圖形，哪一個三角形的紅色邊比較長？
        </div>

        <div class="challenge-cards">
            <div class="challenge-card" id="card-chal-a">
                <div class="challenge-title">三角形 A</div>
                <canvas id="canvas-chal-a" width="320" height="280"></canvas>
                <div class="angle-label" id="label-chal-a">夾角：--度</div>
            </div>
            <div class="challenge-card" id="card-chal-b">
                <div class="challenge-title">三角形 B</div>
                <canvas id="canvas-chal-b" width="320" height="280"></canvas>
                <div class="angle-label" id="label-chal-b">夾角：--度</div>
            </div>
        </div>

        <div class="answer-buttons">
            <button class="ans-btn" onclick="checkAnswer('A')">👈 左邊 (A) 比較長</button>
            <button class="ans-btn" onclick="checkAnswer('SAME')" style="background-color: #95A5A6;">⚖️ 一樣長</button>
            <button class="ans-btn" onclick="checkAnswer('B')">👉 右邊 (B) 比較長</button>
        </div>

        <div id="feedback-msg" class="feedback"></div>
        <button id="next-btn" class="next-btn" onclick="generateChallenge()">✨ 下一題 ✨</button>
    </div>

    <script>
        // 核心繪圖函數
        function drawTriangle(canvasId, a, b, angleDeg) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const angleRad = angleDeg * Math.PI / 180;
            
            // 定義數學座標點 (y軸向上為正)
            const pts = [
                {x: 0, y: 0},
                {x: a, y: 0},
                {x: b * Math.cos(angleRad), y: b * Math.sin(angleRad)}
            ];

            // 尋找邊界以動態縮放並置中
            const minX = Math.min(pts[0].x, pts[1].x, pts[2].x);
            const maxX = Math.max(pts[0].x, pts[1].x, pts[2].x);
            const minY = Math.min(pts[0].y, pts[1].y, pts[2].y);
            const maxY = Math.max(pts[0].y, pts[1].y, pts[2].y);

            const w = maxX - minX;
            const h = maxY - minY;

            // 設定縮放比例，保留 padding 空間避免粗線條被裁切
            const padding = 40; 
            const scale = Math.min((canvas.width - padding*2) / (w || 1), (canvas.height - padding*2) / (h || 1));

            // 計算平移量使圖形置中
            const offsetX = (canvas.width - w * scale) / 2 - minX * scale;
            const offsetY = (canvas.height - h * scale) / 2 - minY * scale;

            // 將數學座標轉換為 Canvas 座標 (Y軸向下)
            const transform = (p) => ({
                x: offsetX + p.x * scale,
                y: canvas.height - (offsetY + p.y * scale)
            });

            const p0 = transform(pts[0]);
            const p1 = transform(pts[1]);
            const p2 = transform(pts[2]);

            // 繪製夾角弧線 (黃色)
            ctx.beginPath();
            // 在 canvas 中，y 往下是正，因此角度的方向需要注意
            // p0到p1是0度，p0到p2在畫面上是負角度（逆時針往上）
            ctx.arc(p0.x, p0.y, 25, 0, -angleRad, true);
            ctx.strokeStyle = '#F39C12';
            ctx.lineWidth = 4;
            ctx.stroke();
            
            // 填滿小扇形區域
            ctx.lineTo(p0.x, p0.y);
            ctx.fillStyle = 'rgba(243, 156, 18, 0.2)';
            ctx.fill();

            // 繪製固定邊 a (藍色實線)
            ctx.beginPath();
            ctx.moveTo(p0.x, p0.y);
            ctx.lineTo(p1.x, p1.y);
            ctx.strokeStyle = '#3498DB';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.stroke();

            // 繪製固定邊 b (藍色實線)
            ctx.beginPath();
            ctx.moveTo(p0.x, p0.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();

            // 繪製變動的第三邊 (紅色虛線)
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = '#E74C3C';
            ctx.lineWidth = 6;
            ctx.setLineDash([10, 10]);
            ctx.stroke();
            ctx.setLineDash([]); // 重設虛線狀態

            // 標示頂點點點，讓圖形更可愛清楚
            const drawDot = (point, color) => {
                ctx.beginPath();
                ctx.arc(point.x, point.y, 6, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();
            };
            drawDot(p0, '#2C3E50');
            drawDot(p1, '#2C3E50');
            drawDot(p2, '#2C3E50');
        }

        // ================= 自由探索模式邏輯 =================
        function updateExplore(cardIndex) {
            const a = parseFloat(document.getElementById('side-a').value) || 4;
            const b = parseFloat(document.getElementById('side-b').value) || 5;
            const angle = parseInt(document.getElementById(`slider-${cardIndex}`).value);
            
            // 更新文字標籤
            document.getElementById(`label-${cardIndex}`).innerText = `夾角：${angle}度`;
            
            // 重繪畫布
            drawTriangle(`canvas-${cardIndex}`, a, b, angle);
        }

        function updateExploreAll() {
            // 防止輸入不合理數值
            let a = parseFloat(document.getElementById('side-a').value);
            let b = parseFloat(document.getElementById('side-b').value);
            if(a <= 0) document.getElementById('side-a').value = 1;
            if(b <= 0) document.getElementById('side-b').value = 1;

            updateExplore(1);
            updateExplore(2);
            updateExplore(3);
        }

        // ================= 水豚老師挑戰模式邏輯 =================
        let currentChalA = 0;
        let currentChalB = 0;

        function generateChallenge() {
            // 隱藏回饋與下一題按鈕
            const feedbackMsg = document.getElementById('feedback-msg');
            const nextBtn = document.getElementById('next-btn');
            feedbackMsg.className = 'feedback'; // 重置 class
            feedbackMsg.innerText = '';
            nextBtn.style.display = 'none';
            
            document.getElementById('card-chal-a').classList.remove('selected');
            document.getElementById('card-chal-b').classList.remove('selected');

            // 隨機生成兩個不同的角度 (限制在 20 到 160 度之間避免太極端)
            do {
                currentChalA = Math.floor(Math.random() * 141) + 20; // 20 ~ 160
                currentChalB = Math.floor(Math.random() * 141) + 20; // 20 ~ 160
            } while (currentChalA === currentChalB); 

            // 固定的 a, b
            const a = 4;
            const b = 5;

            // 繪製
            drawTriangle('canvas-chal-a', a, b, currentChalA);
            drawTriangle('canvas-chal-b', a, b, currentChalB);

            // 更新文字標籤
            document.getElementById('label-chal-a').innerText = `夾角：${currentChalA}度`;
            document.getElementById('label-chal-b').innerText = `夾角：${currentChalB}度`;
        }

        function checkAnswer(userChoice) {
            const feedbackMsg = document.getElementById('feedback-msg');
            const nextBtn = document.getElementById('next-btn');

            let correctAnswer = '';
            if (currentChalA > currentChalB) {
                correctAnswer = 'A';
            } else if (currentChalB > currentChalA) {
                correctAnswer = 'B';
            } else {
                correctAnswer = 'SAME'; // 雖然設計上不會有一樣大的情況，但保留邏輯防呆
            }

            if (userChoice === correctAnswer) {
                feedbackMsg.className = 'feedback success';
                feedbackMsg.innerText = '答對了！夾角越大，對應的邊就越長喔！💯';
                nextBtn.style.display = 'inline-block';
                
                // 標示出對的卡片
                if (correctAnswer === 'A') document.getElementById('card-chal-a').classList.add('selected');
                if (correctAnswer === 'B') document.getElementById('card-chal-b').classList.add('selected');

            } else {
                feedbackMsg.className = 'feedback error';
                feedbackMsg.innerText = '再觀察一下喔！夾角張得比較開的，邊會不會比較長呢？🤔';
                
                document.getElementById('card-chal-a').classList.remove('selected');
                document.getElementById('card-chal-b').classList.remove('selected');
            }
        }

        // ================= 頁籤切換邏輯 =================
        function switchTab(tabName) {
            // 按鈕樣式切換
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // 區塊顯示切換
            document.getElementById('explore-section').classList.remove('active');
            document.getElementById('challenge-section').classList.remove('active');

            if (tabName === 'explore') {
                document.getElementById('explore-section').classList.add('active');
                // 確保切換回來時圖形是正確的
                updateExploreAll();
            } else if (tabName === 'challenge') {
                document.getElementById('challenge-section').classList.add('active');
                generateChallenge(); // 進入挑戰模式自動產生一題
            }
        }

        // 頁面載入時初始化
        window.onload = () => {
            updateExploreAll();
        };

    </script>
</body>
</html>
